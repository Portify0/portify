name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - name: Integration test (Postman)
        run: node dist/index.js postman-migrate tests/fixtures/httpbin-collection.json --target bruno --dry-run
      - name: Integration test (LocalStack)
        run: node dist/index.js localstack-migrate tests/fixtures --dry-run
